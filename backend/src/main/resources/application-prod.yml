spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:sporekart_prod}}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: sporekart-prod-hikari
      leak-detection-threshold: 30000
      validation-timeout: 5000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        default_batch_fetch_size: 16
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:${JWT_SECRET_KEY:}}

server:
  shutdown: graceful
  tomcat:
    connection-timeout: 20000ms
    threads:
      max: 400
      min-spare: 20

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

app:
  rate-limit:
    enabled: true
    requests-per-minute: 120

logging:
  level:
    root: WARN
    com.sporekart: INFO
    org.springframework.security: WARN
