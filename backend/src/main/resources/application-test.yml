server:
  port: 0

spring:
  application:
    name: sporekart-backend-test
  datasource:
    url: jdbc:h2:mem:sporekart_test_db;DB_CLOSE_DELAY=0;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

app:
  version: 0.1.0-TEST
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.sporekart: DEBUG
