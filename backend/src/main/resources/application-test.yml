server:
  port: 0

spring:
  application:
    name: sporekart-backend-test
  datasource:
    url: jdbc:h2:mem:sporekart_test_db;DB_CLOSE_DELAY=0;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

app:
  version: 0.1.0-TEST
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    enabled: true
    auth-limit: 100
    checkout-limit: 100
    search-limit: 100
    admin-limit: 100
    webhook-limit: 200
    general-mutation-limit: 200
    general-read-limit: 500
  observability:
    slow-request-threshold-ms: 100

logging:
  level:
    root: WARN
    com.sporekart: DEBUG
