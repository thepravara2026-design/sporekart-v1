spring:
  config:
    activate:
      on-profile: qat
  datasource:
    url: jdbc:h2:mem:sporekart_qat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:CHANGE_ME_MIN_64_CHAR_RANDOM_SECRET_KEY_FOR_HMAC_SHA512_SIGNING_SPEC}

logging:
  level:
    root: WARN
    com.sporekart: INFO
