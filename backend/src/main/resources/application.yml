server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    connection-timeout: 20000ms
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: sporekart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: sporekart-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:60}

logging:
  level:
    root: INFO
    com.sporekart: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-},%X{userId:-}]"
