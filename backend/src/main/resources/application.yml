server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    connection-timeout: 20000ms
    threads:
      max: 200
      min-spare: 10
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  application:
    name: sporekart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: sporekart-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        default_batch_fetch_size: 16
        jdbc:
          time_zone: UTC
          batch_size: 25
          order_inserts: true
          order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:60}
  observability:
    slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:1000}
    tracing:
      enabled: true
      sample-rate: 1.0
  resilience:
    payment:
      connect-timeout-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:5000}
      max-attempts: ${PAYMENT_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${PAYMENT_BACKOFF_MS:200}
      backoff-multiplier: 2.0
      jitter-factor: 0.25
    shipping:
      connect-timeout-ms: ${SHIPPING_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${SHIPPING_READ_TIMEOUT_MS:5000}
      max-attempts: ${SHIPPING_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${SHIPPING_BACKOFF_MS:200}
      backoff-multiplier: 2.0
      jitter-factor: 0.25
    database:
      lock-timeout-ms: ${DB_LOCK_TIMEOUT_MS:5000}
      max-retry-attempts: 3

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true
    doc-expansion: none
  show-actuator: false
  packages-to-scan: com.sporekart

sporekart:
  training:
    cancellation-admin-days: ${TRAINING_CANCELLATION_ADMIN_DAYS:7}
    cancellation-trainee-days: ${TRAINING_CANCELLATION_TRAINEE_DAYS:2}

logging:
  level:
    root: INFO
    com.sporekart: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-},%X{traceId:-},%X{userId:-}]"
