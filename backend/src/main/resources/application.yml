server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: sporekart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.sporekart: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
