version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sporekart-postgres-prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sporekart_prod}
      POSTGRES_USER: ${DATABASE_USERNAME:-sporekart_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-CHANGE_ME_PRODUCTION_STRONG_PASSWORD}
    networks:
      - sporekart-internal
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-sporekart_user} -d ${DATABASE_NAME:-sporekart_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: sporekart-backend-prod
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-sporekart_prod}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-sporekart_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-CHANGE_ME_PRODUCTION_STRONG_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sporekart-v3-super-secure-production-jwt-secret-key-min-512-bits-for-hmac-sha512-signing-spec}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:5173}
      PAYMENT_PROVIDER_KEY: ${PAYMENT_PROVIDER_KEY:-pk_live_mock_key}
      PAYMENT_PROVIDER_SECRET: ${PAYMENT_PROVIDER_SECRET:-sk_live_mock_secret}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_live_mock_secret}
    networks:
      - sporekart-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: sporekart-frontend-prod
    ports:
      - "80:80"
    networks:
      - sporekart-internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  sporekart-internal:
    driver: bridge

volumes:
  postgres_prod_data:
