name: Security & Quality Audit

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret Scan & Sensitive Files Audit
        run: |
          echo "Scanning for forbidden secret patterns..."
          ! grep -rni --exclude-dir={node_modules,target,.git} "password=" .env*
