global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "sporekart-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["${BACKEND_HOST:localhost}:${BACKEND_PORT:8080}"]
        labels:
          environment: "${SPRING_PROFILES_ACTIVE:production}"
          app: "sporekart-backend"
