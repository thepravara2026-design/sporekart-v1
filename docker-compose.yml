version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sporekart-postgres
    environment:
      POSTGRES_DB: sporekart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sporekart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: sporekart-backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/sporekart_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: sporekart-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
